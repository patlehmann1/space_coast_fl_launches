version: 2

project_name: fl-launches

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: fl-launches
    repository:
      owner: patlehmann1
      name: homebrew-fl-launches
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/patlehmann1/space_coast_fl_launches"
    description: "Next 5 rocket launches from Cape Canaveral, right in your terminal"
    license: "MIT"
    install: |
      bin.install "fl-launches"
    test: |
      system "#{bin}/fl-launches", "--version"
